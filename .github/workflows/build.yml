name: Android build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python3 tools/test-raster.py
      - run: gradle :app:assembleDebug
      - name: Verify APK and generate checksum
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$APK.signing.txt"
          "$TOOLS/aapt" dump badging "$APK" > "$APK.badging.txt"
          grep -F "package: name='com.iingstd.photoprint'" "$APK.badging.txt"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: Photo-Print-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.sha256
            app/build/outputs/apk/debug/*.txt
      - name: Publish final v1.0 APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.0 >/dev/null 2>&1; then
            cp app/build/outputs/apk/debug/app-debug.apk IING-STD-Photo-Print-v1.0.apk
            sha256sum IING-STD-Photo-Print-v1.0.apk > IING-STD-Photo-Print-v1.0.apk.sha256
            gh release create v1.0 IING-STD-Photo-Print-v1.0.apk IING-STD-Photo-Print-v1.0.apk.sha256 --target "$GITHUB_SHA" --title "IING STD Photo Print v1.0" --notes "Final Wi-Fi Direct edition. Debug-signed APK; tested core printing on HP Smart Tank 210-220. Latest preview scale and 4R top margin not physically verified. Maintenance and USB/Epson excluded."
          fi
